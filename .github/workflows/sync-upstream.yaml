name: sync-upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: https://github.com/chen08209/FlClash.git

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream main
          git fetch origin dev:refs/remotes/origin/dev

      - name: Merge upstream/main into main
        id: merge-main
        run: |
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR for manual main conflict resolution
        if: steps.merge-main.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          branch="sync/upstream-main-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git merge upstream/main --no-edit || true
          git push origin "$branch" --force
          gh pr create --title "Sync upstream main ($(date +%Y-%m-%d)) — needs conflict resolution" \
            --body "Automated sync from chen08209/FlClash \`main\` hit merge conflicts. Resolve them on this branch, then merge — merging will NOT auto-tag a release and will NOT forward \`dev\`, so tag manually and merge \`main\` into \`dev\` once it's in." \
            --base main --head "$branch"

      - name: Push main and tag a release
        if: steps.merge-main.outputs.conflict == 'false'
        run: |
          git push origin main

          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/p' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi
          tag="v${version}"

          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "Tag $tag already exists, skipping release"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Forward dev from main
        id: merge-dev
        if: steps.merge-main.outputs.conflict == 'false'
        run: |
          git checkout -B dev origin/dev
          if git merge main --no-edit; then
            git push origin dev
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR for manual dev conflict resolution
        if: steps.merge-dev.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          branch="sync/main-to-dev-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git merge main --no-edit || true
          git push origin "$branch" --force
          gh pr create --title "Forward main into dev ($(date +%Y-%m-%d)) — needs conflict resolution" \
            --body "\`main\` took an upstream sync that does not merge cleanly into \`dev\`. Resolve the conflicts on this branch, then merge." \
            --base dev --head "$branch"
